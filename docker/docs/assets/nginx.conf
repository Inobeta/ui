server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /assets/index.css {
        try_files $uri =404;
    }

    location /assets/ {
        return 404;
    }

    location ^~ /v/ {
        alias /srv/docs/versions/;
        autoindex off;
        index index.html;
    }
}
